<!DOCTYPE html>
<html>
<head>
    <title>Folder Upload Limit Test</title>
</head>
<body>
    <h1>Test Folder Upload 1GB Limit</h1>
    <input type="file" id="folderInput" webkitdirectory multiple>
    <div id="output"></div>

    <script>
        // Copy the relevant configuration and functions from your main app
        const LANVAN_CONFIG = {
            MAX_FOLDER_SIZE: 1024 * 1024 * 1024, // 1GB - maximum folder upload size
        };

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showToast(message, duration) {
            document.getElementById('output').innerHTML = `<p style="color: blue;">${message}</p>`;
            console.log(message);
        }

        // Test the folder validation logic
        document.getElementById('folderInput').addEventListener('change', (event) => {
            const files = event.target.files;
            if (!files || files.length === 0) {
                showToast('⚠️ No files selected!', 3000);
                return;
            }

            // Get folder info
            const folderSet = new Set();
            Array.from(files).forEach(file => {
                if (file.webkitRelativePath) {
                    const rootFolder = file.webkitRelativePath.split('/')[0];
                    folderSet.add(rootFolder);
                }
            });
            const folderName = folderSet.size === 1 ? Array.from(folderSet)[0] : 'Selected Folders';
            const fileCount = files.length;

            // Calculate total folder size and validate against 1GB limit
            const totalFolderSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
            const folderSizeFormatted = formatFileSize(totalFolderSize);

            // Check if folder exceeds 1GB limit
            if (totalFolderSize > LANVAN_CONFIG.MAX_FOLDER_SIZE) {
                showToast(`❌ Folder "${folderName}" is too large (${folderSizeFormatted}). Maximum folder size is 1 GB. Please select a smaller folder.`, 5000);
                return;
            }

            showToast(`✅ Folder "${folderName}" is valid (${folderSizeFormatted} with ${fileCount} files). Would proceed with upload.`, 3000);
        });
    </script>
</body>
</html>
