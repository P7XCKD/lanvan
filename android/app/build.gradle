plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.probz.lanvan'
    compileSdk 35

    defaultConfig {
        applicationId "com.probz.lanvan"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            // buildPython configuration omitted to let Chaquopy automatically resolve suitable host interpreter
            version "3.10"
            pip {
                // Core dependencies - all versions pinned for reproducible builds
                install "fastapi==0.98.0"
                install "pydantic==1.10.21"
                install "uvicorn==0.23.2"
                install "jinja2==3.1.6"
                install "python-multipart==0.0.20"
                install "aiofiles==23.2.1"
                install "qrcode==7.4.2"
                install "zeroconf==0.135.0"
                install "websockets==11.0.3"
                install "cryptography==42.0.8"
                install "psutil==7.1.3"
                install "pyperclip==1.8.2"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main {
            python {
                srcDirs = ["src/main/python", "../../"]
                include "start_server.py"
                include "app/**"
                exclude "app/**/__pycache__/**"
                exclude "app/**/*.pyc"
                exclude "testing/**"
                exclude "tests/**"
                exclude "docs/**"
                exclude "app/README.md"
                exclude "app/core/README.md"
                exclude "app/routers/README.md"
                exclude "app/utils/README.md"
                exclude "app/ws_manager/README.md"
                exclude "app/templates/README.md"
                exclude "copilot/**"
                exclude ".git/**"
                exclude ".gitignore"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.android.billingclient:billing-ktx:6.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register('copyAssets', Copy) {
    from '../../app/static'
    into 'src/main/assets/app/static'
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}
tasks.register('copyTemplates', Copy) {
    from '../../app/templates'
    into 'src/main/assets/app/templates'
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}
tasks.register('copyCerts', Copy) {
    from '../../certs'
    into 'src/main/assets/certs'
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}
preBuild.dependsOn(copyAssets)
preBuild.dependsOn(copyTemplates)
preBuild.dependsOn(copyCerts)
