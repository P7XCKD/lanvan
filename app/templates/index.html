<!DOCTYPE html>
<html>
<head>
  <title>Lanvan</title>
 <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">

</head>
<body>

  <h1>{{ msg }}</h1>

  <section>
    <h2>Upload a File</h2>
    <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Upload</button>
    </form>
  </section>

  <form action="{{ url_for('clear_files') }}" method="POST" style="display: inline;">
    <button type="submit" onclick="return confirm('Are you sure you want to clear all uploaded files?')">
      Clear History
    </button>
  </form>
<form action="/upload-multiple" method="post" enctype="multipart/form-data">
  <input type="file" name="files" multiple>
  <button type="submit">Upload Files</button>
</form>

  <section>
    <h2>Available Files</h2>
    <ul>
      {% for file in files %}
        <li>
          <a href="{{ url_for('download_file', filename=file) }}">{{ file }}</a>
        </li>
      {% else %}
        <li>No files uploaded yet.</li>
      {% endfor %}
    </ul>
  </section>

</body>
</html>
