<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LanVan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FilePond Styles -->
  <link href="{{ url_for('static', path='filepond/css/filepond.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', path='filepond/css/filepond-plugin-image-preview.min.css') }}" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f8f9fb;
      padding: 1rem;
      margin: 0;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      color: #333;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    section h2 {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      color: #444;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
    }

    .file-card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      transition: box-shadow 0.2s ease;
    }

    .file-card:hover {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .file-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .file-name {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: #333;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-btn {
      display: inline-block;
      background: #3498db;
      color: white;
      text-decoration: none;
      padding: 0.4rem 0.7rem;
      border-radius: 5px;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .download-btn:hover {
      background: #2c80b4;
    }

    button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #c0392b;
    }

    @media (max-width: 600px) {
      .file-grid {
        grid-template-columns: 1fr;
      }

      .file-name {
        white-space: normal;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>{{ msg }}</h1>
</header>

<main>

  <!-- 📤 Upload Section -->
  <section>
    <h2>Upload Files</h2>
    <input type="file" class="filepond" name="files" multiple required />
  </section>

  <!-- 🧹 Clear All Section -->
  <section>
    <h2>Manage Files</h2>
    <form method="POST" action="{{ url_for('clear_files') }}" onsubmit="return confirm('Are you sure you want to delete all uploaded files?')">
      <button type="submit">🧹 Clear All Files</button>
    </form>
  </section>

  <!-- 📂 File List Section -->
  <section>
    <h2>Available Files</h2>
    {% if files %}
      <div class="file-grid">
        {% for file in files %}
        <div class="file-card">
          <div class="file-icon">📄</div>
          <div class="file-name" title="{{ file }}">{{ file }}</div>
          <a href="{{ url_for('download_file', filename=file) }}" download class="download-btn">⬇ Download</a>
        </div>
        {% endfor %}
      </div>
    {% else %}
      <p>No files uploaded yet.</p>
    {% endif %}
  </section>

</main>

<!-- 🌈 FilePond Scripts -->
<script src="{{ url_for('static', path='filepond/js/filepond.min.js') }}"></script>
<script src="{{ url_for('static', path='filepond/js/filepond-plugin-file-validate-size.min.js') }}"></script>
<script src="{{ url_for('static', path='filepond/js/filepond-plugin-file-validate-type.min.js') }}"></script>
<script src="{{ url_for('static', path='filepond/js/filepond-plugin-image-preview.min.js') }}"></script>

<script>
  FilePond.registerPlugin(
    FilePondPluginFileValidateSize,
    FilePondPluginFileValidateType,
    FilePondPluginImagePreview
  );

  FilePond.setOptions({
    server: {
      url: '/upload-multiple',
      process: {
        method: 'POST',
        headers: {
          'accept': 'application/json'
        }
      },
      revert: null,
      restore: null,
      load: null,
      fetch: null
    },
    allowMultiple: true,
    maxParallelUploads: 3,
    instantUpload: true
  });

  FilePond.create(document.querySelector('.filepond'));
</script>

</body>
</html>
