<!DOCTYPE html>

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!--  INSTANT THEME LOADER - NO FLASH! -->
    <script>
        // Apply theme IMMEDIATELY before page renders to prevent flash
        (function () {
            let themePref = localStorage.getItem('theme_preference');
            if (themePref === null) {
                const legacyDark = localStorage.getItem('dark_mode_enabled');
                if (legacyDark !== null) {
                    themePref = legacyDark === '1' ? 'dark' : 'light';
                } else {
                    themePref = 'system';
                }
                localStorage.setItem('theme_preference', themePref);
            }

            let isDarkMode = true;
            if (themePref === 'dark') {
                isDarkMode = true;
            } else if (themePref === 'light') {
                isDarkMode = false;
            } else {
                isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }

            if (isDarkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }

            // Zero-flicker view mode & active tab initialization before first paint
            var viewModePref = localStorage.getItem('lanvan_view_mode') || 'grid';
            document.documentElement.setAttribute('data-view-mode', viewModePref);

            var activeTabPref = localStorage.getItem('lanvan_active_tab') || 'file';
            document.documentElement.setAttribute('data-active-tab', activeTabPref);

            // Early debug flag initialization from localStorage
            try {
                if (localStorage.getItem('debug') === 'true') {
                    window.DEBUG_MODE = true;
                }
            } catch (e) {}

            // Double rAF: remove startup transition suppression after first stable paint
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    document.documentElement.classList.remove("startup");
                    document.documentElement.classList.remove("booting");
                });
            });
        })();
    </script>
    <!-- Critical pre-paint CSS: inline in <head> so views resolve before ANY external resource loads -->
    <style>
        /* Production Startup Shell (Guarantees zero browser startup flash) */
        html.booting .android-app {
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #startup-shell {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color, #0f1117);
            color: var(--text-color, #f0f0f0);
            opacity: 1;
            pointer-events: auto;
            transition: opacity 500ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        html[data-theme="dark"] #startup-shell {
            background-color: #0f1117;
            color: #ffffff;
        }

        html[data-theme="light"] #startup-shell {
            background-color: #f8fafc;
            color: #0f172a;
        }

        html:not(.booting) .android-app {
            visibility: visible;
            opacity: 1;
            transition: opacity 500ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        html:not(.booting) #startup-shell {
            opacity: 0;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {

            html:not(.booting) .android-app,
            #startup-shell {
                transition: none !important;
            }
        }

        html.startup *,
        html.startup *::before,
        html.startup *::after {
            transition: none !important;
            animation: none !important;
        }

        #fileView,
        #clipboardView {
            display: none;
        }

        [data-active-tab="file"] #fileView {
            display: flex;
        }

        [data-active-tab="clipboard"] #clipboardView {
            display: flex;
        }

        #fileTransferSection,
        #fileListSection,
        #clipboardSection {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/lanvan.css') }}?v={{ cache_version }}">

      Toggle text visibility overrides:
      #filesLabel, #foldersLabel { color: #333; }
      [data-theme="dark"] #filesLabel { color: #f0f0f0 !important; }
      [data-theme="dark"] #foldersLabel { color: #f0f0f0 !important; }
      #darkModeLabel, #aesLabel, #filesLabel, #foldersLabel { color: #333 !important; }
      Toggle Label Text Fixes
    -->
</head>

<body>
    <!-- Production Startup Shell (Covers viewport until browser reaches first stable frame) -->
    <div id="startup-shell" aria-hidden="true">
        <div style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
            <img src="{{ request.url_for('static', path='images/icon.png') }}?v={{ cache_version }}" alt="Lanvan"
                style="width:54px; height:54px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,0.2);" />
        </div>
    </div>
    <script>
        // Only clear console on startup if NOT in debug mode
        if (!window.DEBUG_MODE) {
            console.clear();
        }

        window.LanvanConfig = {
            fileUtilsUrl: "{{ request.url_for('static', path='js/file-utils.js') }}"
        };

        // --- Automated Click & UI State Interaction Logger ---
        document.addEventListener('click', function (e) {
            const target = e.target.closest('button, a, input, [onclick], .file-card, .context-item, .sheet-action-item, .view-switcher-btn, .drop-zone, .tab-btn');
            if (!target) return;

            const label = target.getAttribute('aria-label') || target.getAttribute('title') || target.innerText || target.id || target.className || target.tagName;
            const cleanLabel = (label || '').toString().trim().replace(/\s+/g, ' ').substring(0, 40);

            console.log(
                '%c[USER CLICK] %c"%s" %c(Element: %s)',
                'color: #3b82f6; font-weight: bold;',
                'color: #10b981; font-weight: 600;',
                cleanLabel,
                'color: #64748b; font-size: 0.85em;',
                target.tagName.toLowerCase() + (target.id ? '#' + target.id : '')
            );
        }, true);

        // --- UI Display & Toast Logger ---
        window.logUIDisplay = function (featureName, details) {
            console.log(
                '%c[SYSTEM UI DISPLAY] %c%s %c- %s',
                'color: #8b5cf6; font-weight: bold;',
                'color: #f59e0b; font-weight: 600;',
                featureName,
                'color: #475569;',
                typeof details === 'object' ? JSON.stringify(details) : details
            );
        };
    </script>

    <!-- Global Window Drag-and-Drop Active Overlay -->
    <div id="globalDragOverlay" class="global-drag-overlay">
        <div class="global-drag-card">
            <i data-lucide="upload-cloud" class="global-drag-icon"></i>
            <h2 class="global-drag-title">Drop files or folders to upload</h2>
            <p class="global-drag-subtitle">Release anywhere to start transfer instantly</p>
        </div>
    </div>

                <button onclick="closeDeviceLogsModal()" style="
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
          ">
                    <i data-lucide="x" style="width:1em;height:1em;vertical-align:-0.125em;display:inline-block;"></i>
                    Close
                </button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h4 style="margin: 0; color: var(--text-color); font-size: 1.1rem;"><i data-lucide="smartphone"
                        style="width:1em;height:1em;vertical-align:-0.125em;display:inline-block;"></i> This Device
                    Session Only</h4>
                <div style="display: flex; gap: 0.5rem;">
                    <button onclick="downloadDeviceLogs()" id="downloadLogsBtn"
                        style="background: #28a745; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer;">
                        <i data-lucide="file-text"
                            style="width:1em;height:1em;vertical-align:-0.125em;display:inline-block;"></i> Download
                        Logs
                    </button>
                    <button onclick="clearDeviceLogs()" id="clearLogsBtn"
                        style="background: var(--settings-bg); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer;">
                        <i data-lucide="trash-2"
                            style="width:1em;height:1em;vertical-align:-0.125em;display:inline-block;"></i> Clear Logs
                    </button>
                </div>
            </div>

            <div id="deviceLogsStats"
                 style="background: var(--input-bg); padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-color); border: 1px solid var(--border-color);">
                <!-- Logs stats will be populated here -->
            </div>

            <div id="deviceLogsSection" style="display: block;">
                <div id="deviceLogsContent"
                     style="max-height: 400px; overflow-y: auto; background: var(--input-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); color: var(--text-color) !important;">
                    <!-- Logs content will be populated here -->
                </div>
                <div id="deviceLogsPagination" style="text-align: center; margin-top: 1rem; display: none;">
                    <!-- Pagination controls will be populated here -->
                </div>
            </div>
        </div>
    </div>
